<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shake Sound</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="emoji">📱</div>

    <img src="logo.png" alt="Logo" class="logo">

    <h1>Shake to Play Sound</h1>
    <p>Tap the button and shake your phone</p>

    <!-- IMPORTANT BUTTON -->
    <button id="enableBtn">Enable Motion</button>

    <!-- TEST BUTTON (temporary) -->
    <button onclick="document.getElementById('sound').play()"
            style="margin-top:10px;background:#fff;">
      Test Sound
    </button>

    <audio id="sound" src="sound.wav"></audio>
  </div>

  <script src="script.js"></script>

  <!-- INLINE CHECK -->
  <script>
    document.getElementById("enableBtn").addEventListener("click", () => {
      alert("Button works ✅");
      startMotion();
    });
  </script>

</body>
</html>
